<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle de Dívidas Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--primary:#2563eb;--success:#22c55e;--danger:#ef4444;--warning:#f59e0b;--background:#f1f5f9;--card-bg:#fff;--text-main:#1e293b;--text-muted:#64748b;--border:#e2e8f0}
*{box-sizing:border-box}body{font-family:Inter,Arial,sans-serif;background:var(--background);color:var(--text-main);margin:0;padding:20px 0 120px;overflow-x:hidden}
.container{max-width:700px;margin:auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 20px #0000000d}
h2{text-align:center;font-weight:800;color:var(--danger);margin:0 0 15px}
.tabs{display:flex;gap:8px;margin-bottom:20px;background:#e2e8f0;padding:5px;border-radius:12px}.tab{flex:1;padding:12px;border:0;background:transparent;cursor:pointer;border-radius:10px;font-weight:700;color:var(--text-muted)}.tab.active{background:#fff;color:var(--primary);box-shadow:0 4px 10px #0000001a}
.form-group{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}input,select,.btn-main{padding:12px;border-radius:10px;border:1px solid var(--border);font-size:15px;outline:none;max-width:100%}input:focus{border-color:var(--primary);box-shadow:0 0 0 3px #2563eb1a}.btn-main{background:var(--primary);color:#fff;font-weight:600;cursor:pointer;border:0}.btn-main:active{transform:scale(.98)}
.cliente-group{background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}.cliente-header{padding:16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-left:6px solid var(--danger)}
.devedor{background:#fff;padding:16px;border-radius:12px;border:1px solid var(--border);border-left:6px solid var(--danger);margin-bottom:12px;position:relative}.status-processando{border-left-color:var(--primary)!important;background:#eff6ff!important;opacity:.8;pointer-events:none}.status-pago{border-left-color:var(--success)!important}.selecionado-soma{background:#fff7ed!important;border-color:var(--warning)!important;border-left-color:var(--warning)!important}
.info{font-size:11px;color:var(--text-muted);margin:8px 0;line-height:1.4}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.btn-action{padding:10px 16px;border-radius:8px;border:0;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px}.btn-pagar-card{background:var(--primary);color:#fff}.btn-excluir-ui{background:#fee2e2;color:#991b1b}.spinner{width:14px;height:14px;border:2px solid white;border-bottom-color:transparent;border-radius:50%;display:inline-block;animation:rotation 1s linear infinite}@keyframes rotation{to{transform:rotate(360deg)}}
#modalLixeira{display:none;position:fixed;inset:0;background:#0f172ae6;z-index:3000;padding:20px;overflow-y:auto}#somaBar{display:none;position:fixed;bottom:0;left:0;width:100%;background:#1e293b;color:#fff;padding:20px;z-index:2000;border-radius:24px 24px 0 0}
.btn-relatorio{background:var(--success);color:#fff;border:0;border-radius:12px;font-weight:800;font-size:13px;cursor:pointer;flex:1;height:45px;display:flex;align-items:center;justify-content:center;gap:8px}.modal-full{display:none;position:fixed;inset:0;background:#0f172ae6;z-index:4000;padding:15px;overflow-y:auto}.modal-content{max-width:500px;margin:auto;background:#fff;border-radius:20px;padding:20px;position:relative;max-height:90vh;overflow-y:auto}.hidden{display:none!important}#btnVoltar{background:#64748b;color:white;margin-bottom:15px;width:100%}.obs-text{display:block;background:#fffbeb;color:#92400e;padding:4px 8px;border-radius:6px;font-size:11px;margin:5px 0;border:1px solid #fef3c7;font-weight:600}#form-rapido{background:#dbeafe;padding:15px;border-radius:14px;border:2px solid var(--primary);margin-bottom:20px;box-shadow:0 4px 12px #2563eb26}
.btn-pix-neon{position:fixed;bottom:25px;right:25px;z-index:9998;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(145deg,#00ff88,#00b95c);color:white;font-weight:900;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0 10px #00ff88,0 0 25px #00ff88,inset 0 4px 8px #ffffff80,inset 0 -5px 8px #0000004d;animation:pulsePix 2s infinite}.btn-pix-neon:before{content:"";position:absolute;width:35%;height:180%;background:#ffffffcc;transform:rotate(35deg);left:-70%;top:-40%;animation:brilho 3s infinite}.btn-pix-neon span{position:relative;z-index:2;text-shadow:0 0 5px white,0 0 15px white}@keyframes brilho{0%{left:-80%}50%,100%{left:130%}}@keyframes pulsePix{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#modal-pix{display:none;position:fixed;inset:0;background:#0009;z-index:9999;align-items:center;justify-content:center}.pix-content{background:#fff;padding:25px;border-radius:24px;width:90%;max-width:450px;position:relative;text-align:center;max-height:90vh;overflow:auto}.pix-content input{width:100%;padding:15px;font-size:1.5rem;margin:10px 0;text-align:center}.pix-content #btn-gerar{width:100%;padding:16px;background:#00d977;color:#fff;border:0;border-radius:14px;font-size:1.1rem;font-weight:bold}.pix-spinner{border:4px solid #eee;border-top:4px solid #00d977;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:20px auto;display:none}@keyframes spin{to{transform:rotate(360deg)}}#qr-img{width:260px;max-width:100%;margin-top:20px;border-radius:12px;display:none}#timer{font-size:1.2rem;color:#64748b;margin-top:10px;font-weight:600}#tela-sucesso{position:absolute;inset:0;background:#00d977;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;border-radius:24px;z-index:1000}
@media(max-width:520px){.container{margin:0 10px;padding:16px}.modal-content{padding:16px}#somaBar>div{gap:10px;flex-wrap:wrap}}
</style>
</head>
<body>
<button class="btn-pix-neon" onclick="document.getElementById('modal-pix').style.display='flex'"><span>PIX</span></button>
<div id="modal-pix"><div class="pix-content">
<span onclick="document.getElementById('modal-pix').style.display='none'" style="position:absolute;right:20px;top:10px;cursor:pointer;font-size:24px">×</span>
<h2 style="color:#1e293b">Receber via Pix</h2><input type="number" id="valor" placeholder="R$ 0,00" step="0.01" min="0.01">
<button id="btn-gerar" onclick="gerarPix()">Gerar QR Code</button>
<div id="area-qr"><div class="pix-spinner" id="loader"></div><img id="qr-img"><h1 id="valor-qr" style="font-size:2rem;font-weight:900"></h1><p id="timer"></p></div>
<div id="tela-sucesso"><h1 style="font-size:3rem">✅ PAGO!</h1><p id="detalhes-pagamento" style="font-size:1.5rem"></p><button onclick="imprimirRecibo(document.getElementById('valor').value,'Cliente')" style="padding:12px;border-radius:12px;border:0">SEGUNDA VIA PIX</button></div>
</div></div>
<div class="container">
<h2>Pendências</h2>
<div id="login-section" class="form-group"><select id="funcionario" style="flex:1"><option value="">Nome</option><option>Bruna</option><option>Elayne</option><option>Karol</option><option>Rodrigo</option><option>Gabriela</option><option value="Vagner">Vagner (ADM)</option></select><input type="password" id="senha" placeholder="Senha"><button class="btn-main" onclick="acessarSistema()">Entrar</button></div>
<div id="logado-msg" class="hidden" style="justify-content:space-between;align-items:center;margin-bottom:15px;background:#f8fafc;padding:10px;border-radius:12px;border:1px solid var(--border)"><span style="font-weight:700"><i class="fa-solid fa-circle-user" style="color:var(--primary)"></i> <span id="quem"></span></span><div style="display:flex;gap:8px"><button id="btnLixeira" class="btn-action hidden" onclick="abrirLixeira()"><i class="fa-solid fa-trash-can"></i></button><button class="btn-action" style="background:#fee2e2;color:#991b1b;padding:8px 12px" onclick="sair()"><i class="fa-solid fa-power-off"></i></button></div></div>
<button id="btnConfigAdm" onclick="abrirMenuUsuarios()" style="display:none;position:fixed;right:15px;top:15px;z-index:5000;border:0;border-radius:50%;width:50px;height:50px;font-size:25px;background:#2563eb;color:white">⚙️</button>
<div id="menuUsuariosAdm" style="display:none;position:fixed;right:10px;top:75px;background:white;z-index:5000;padding:15px;border-radius:15px;box-shadow:0 0 15px #999;width:280px"><h3>⚙️ Usuários ADM</h3><input id="novoUser" placeholder="Nome/Login"><input id="novaSenha" placeholder="Senha"><button class="btn-main" onclick="salvarUsuarioAdm()" style="width:100%">SALVAR USUÁRIO</button><div id="listaUsuariosAdm"></div></div>
<div id="area-restrita" class="hidden">
<div id="form-anotar" style="background:#fff5f5;padding:12px;border-radius:12px;border:1px solid #feb2b2;margin-bottom:10px"><div class="form-group"><input type="text" id="nomeCliente" placeholder="Nome do Cliente" style="flex:2"><input type="tel" inputmode="decimal" id="valorMask" placeholder="R$ 0,00" style="flex:1" oninput="mascaraMoeda(this)"></div><div class="form-group" style="margin-bottom:0"><input type="text" id="observacao" placeholder="Observação" style="flex:1"><button class="btn-main" style="background:var(--danger);min-width:120px;height:45px" onclick="adicionarDivida('nomeCliente','valorMask','observacao')">ANOTAR</button></div></div>
<div id="form-rapido" class="hidden"><div style="margin-bottom:10px;font-weight:900;font-size:14px;color:#1e40af">➕ NOVO ITEM PARA: <span id="nomeFocado" style="text-decoration:underline"></span></div><div class="form-group"><input type="tel" inputmode="decimal" id="valorRapido" placeholder="R$ 0,00" style="flex:1" oninput="mascaraMoeda(this)"><input type="text" id="obsRapida" placeholder="O que é?" style="flex:2"><button class="btn-main" style="background:#1e40af;min-width:100px" onclick="adicionarDividaRapida()">ADICIONAR</button></div></div>
<button id="btnVoltar" class="btn-main" onclick="fecharFoco()"><i class="fa-solid fa-arrow-left"></i> VOLTAR À LISTA</button>
<div style="display:flex;gap:10px;margin-bottom:15px"><button id="btnSomar" class="btn-main" style="flex:1;background:var(--warning);border-radius:12px;height:45px;font-size:13px" onclick="ativarSoma()"><i class="fa-solid fa-calculator"></i> MODO SOMA</button><button class="btn-relatorio" onclick="abrirRelatorio()"><i class="fa-solid fa-chart-line"></i> RELATÓRIO</button></div>
<div class="tabs" id="abas-filtro"><button class="tab active" onclick="setFiltro('pendente',this)">PENDENTES</button><button class="tab" onclick="setFiltro('pago',this)">PAGOS</button></div><div id="lista"><p style="text-align:center;color:var(--text-muted)">Carregando...</p></div>
</div></div>
<div id="modalDesempenho" class="modal-full"><div class="modal-content" style="max-width:550px"><div style="text-align:center;margin-bottom:15px"><h3 style="margin:0;font-size:18px;color:var(--primary)"><i class="fa-solid fa-cash-register"></i> Relatório de Caixa</h3><p id="subtituloRelatorio" style="font-size:11px;color:var(--text-muted);margin:5px 0;font-weight:bold"></p></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px"><div><label style="font-size:10px;font-weight:bold">INÍCIO:</label><input type="date" id="dataInicio" style="width:100%;padding:5px"></div><div><label style="font-size:10px;font-weight:bold">FIM:</label><input type="date" id="dataFim" style="width:100%;padding:5px"></div></div>
<div id="filtroAdm" class="hidden" style="margin-bottom:15px;padding:10px;background:#f1f5f9;border-radius:10px"><select id="filtroFuncionarioAdm" onchange="calcularDesempenho()" style="width:100%;padding:8px"><option value="TODOS">--- TODOS ---</option><option>Bruna</option><option>Elayne</option><option>Karol</option><option>Rodrigo</option><option>Gabriela</option></select></div>
<div style="background:#f0fdf4;border:2px dashed #22c55e;padding:15px;border-radius:12px;text-align:center;margin-bottom:10px"><small style="font-weight:800;font-size:10px">TOTAL A REPASSAR:</small><span id="resRepasse" style="color:#15803d;font-size:28px;font-weight:900;display:block">R$ 0,00</span></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px"><div style="background:#eff6ff;padding:10px;border-radius:8px;text-align:center"><small>Próprios</small><span id="resRecebidoProprio" style="display:block;font-weight:900">R$ 0,00</span></div><div style="background:#fff7ed;padding:10px;border-radius:8px;text-align:center"><small>Terceiros</small><span id="resRecebidoOutros" style="display:block;font-weight:900">R$ 0,00</span></div></div>
<!-- ÚNICA ADIÇÃO VISUAL: TOTAL PIX -->
<div style="background:#ecfdf5;padding:12px;border-radius:8px;margin-bottom:10px;border:1px solid #bbf7d0;text-align:center"><small>Total Recebido via PIX</small><span id="resPix" style="display:block;font-weight:900;font-size:22px;color:#15803d">R$ 0,00</span></div>
<div style="background:#fef2f2;padding:10px;border-radius:8px;margin-bottom:10px;text-align:center"><small>Total Anotado no Fiado</small><span id="resAnotado" style="display:block;font-weight:900">R$ 0,00</span></div><div id="extratoRecebidos" style="max-height:150px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:8px"></div>
<button onclick="enviarWhatsApp()" class="btn-main" style="width:100%;margin-top:15px;background:#25d366;height:50px;font-size:16px"><i class="fa-brands fa-whatsapp"></i> ENVIAR WHATSAPP</button><button onclick="imprimirRelatorio()" class="btn-main" style="width:100%;margin-top:10px;background:#2563eb;height:50px;font-size:16px">🖨️ IMPRIMIR RELATÓRIO</button><div style="display:flex;gap:10px;margin-top:15px"><button onclick="document.getElementById('modalDesempenho').style.display='none'" style="flex:1;padding:12px;background:#64748b;color:white;border-radius:8px;border:0;font-weight:bold">FECHAR</button><button onclick="definirHoje()" style="flex:1;padding:12px;background:var(--primary);color:white;border-radius:8px;border:0;font-weight:bold">HOJE</button></div></div></div>
<div id="modalLixeira"><div style="max-width:600px;margin:auto;background:white;border-radius:20px;padding:25px"><h3 style="color:var(--danger)">Auditoria de Exclusões</h3><div id="listaLixeira"></div><button onclick="document.getElementById('modalLixeira').style.display='none'" class="btn-main" style="width:100%;margin-top:15px">FECHAR</button></div></div>
<div id="somaBar"><div style="max-width:700px;margin:auto;display:flex;justify-content:space-between;align-items:center"><div><small>TOTAL SELECIONADO</small><br><strong id="totalSoma" style="font-size:26px;color:#4ade80">R$ 0,00</strong></div><div style="display:flex;gap:12px"><button class="btn-main" id="confirmarSoma" style="background:var(--success);padding:15px 20px">LIQUIDAR</button><button class="btn-action" id="encerrarSoma" style="background:#475569;color:white">CANCELAR</button></div></div></div>
<script>
let intervaloChecagem,countdown;const enc=new TextEncoder();
function imprimirRecibo(valor,nome){const texto=`PAGAMENTO REALIZADO COM SUCESSO\n\nVALOR: R$ ${valor}\n\nPAGADOR:\n${nome}\n\nVENDEDOR:\n${localStorage.getItem("usuarioAtual")||"Sem operador"}\n\nDATA/HORA:\n${new Date().toLocaleString("pt-BR")}\n\nObrigado!\n`;const bytes=[new Uint8Array([0x1B,0x40,0x1B,0x61,1]),enc.encode(texto)];const b64=btoa(String.fromCharCode(...bytes.reduce((a,b)=>[...a,...b],[])));window.location.href=`rawbt:base64,${b64}`}
async function gerarPix(){const valor=document.getElementById("valor").value;if(!valor||valor<=0)return alert("Digite um valor");document.getElementById("loader").style.display="block";document.getElementById("qr-img").style.display="none";document.getElementById("btn-gerar").disabled=true;try{const res=await fetch("https://fgk-xdz2.onrender.com/criar-pix",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({valor})});const data=await res.json();if(!res.ok||!data.qr_code_base64||!data.id)throw Error("Falha ao criar PIX");document.getElementById("qr-img").src="data:image/png;base64,"+data.qr_code_base64;document.getElementById("qr-img").style.display="block";document.getElementById("valor-qr").innerText="R$ "+valor;document.getElementById("loader").style.display="none";iniciarTimer(300);clearInterval(intervaloChecagem);intervaloChecagem=setInterval(()=>verificarPagamento(data.id,valor),2000)}catch(e){alert("Erro ao gerar PIX. Tente novamente.");document.getElementById("loader").style.display="none"}finally{document.getElementById("btn-gerar").disabled=false}}
function iniciarTimer(s){clearInterval(countdown);const t=document.getElementById("timer");countdown=setInterval(()=>{s--;t.innerText=`Expira em: ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;if(s<=0){clearInterval(countdown);clearInterval(intervaloChecagem);resetarTela()}},1000)}
async function verificarPagamento(id,valor){try{const r=await fetch(`https://fgk-xdz2.onrender.com/verificar-pix/${id}`);const d=await r.json();if(d.status==="approved"){clearInterval(intervaloChecagem);clearInterval(countdown);const nome=d.payer_name||"Cliente";imprimirRecibo(valor,nome);if(window.registrarPixRecebido)await window.registrarPixRecebido(valor,nome);mostrarSucesso(valor,nome)}}catch(e){console.error("Erro ao verificar pagamento",e)}}
function mostrarSucesso(valor,nome){document.getElementById("tela-sucesso").style.display="flex";document.getElementById("detalhes-pagamento").innerText=`R$ ${valor} de ${nome}`;setTimeout(()=>{document.getElementById("modal-pix").style.display="none";resetarTela()},3000)}
function resetarTela(){document.getElementById("tela-sucesso").style.display="none";document.getElementById("qr-img").style.display="none";document.getElementById("valor-qr").innerText="";document.getElementById("timer").innerText="";document.getElementById("valor").value=""}
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
import{getFirestore,collection,addDoc,updateDoc,doc,query,orderBy,onSnapshot}from"https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCfHDdYAW8DkZ-XELvUWhUo3ln5rAu-1h8",authDomain:"adrjb-99601.firebaseapp.com",projectId:"adrjb-99601",storageBucket:"adrjb-99601.appspot.com",messagingSenderId:"688129341856",appId:"1:688129341856:web:c0a378171329e52c038cc5"};
const app=initializeApp(firebaseConfig),db=getFirestore(app);
window.registrarPixRecebido=async(valor,nome)=>{const operador=localStorage.getItem("usuarioAtual")||"Sem operador";await addDoc(collection(db,"dividas"),{nome:"PIX - "+nome,observacao:"Recebimento via QR Code PIX",valor:parseFloat(valor),funcionario:operador,quemPagou:operador,dataDevendo:new Date().toISOString(),dataPago:new Date().toISOString(),pago:true,removida:false,pix:true})};
let senhas=JSON.parse(localStorage.getItem("usuariosSistema"))||{Bruna:"17",Elayne:"26",Karol:"14",Rodrigo:"04",Gabriela:"66",Vagner:"admin"};
let devedores=[],filtroAtual="pendente",processandoIds=new Set(),modoSoma=false,selecionados=new Set(),totalSoma=0,clienteEmFoco=null;
let valAnotado=0,valProprio=0,valOutros=0,valRepasse=0,valPix=0;
window.mascaraMoeda=i=>{let v=i.value.replace(/\D/g,"");i.value="R$ "+(Number(v)/100).toFixed(2).replace(".",",")};
window.acessarSistema=()=>{const f=document.getElementById("funcionario").value,s=document.getElementById("senha").value;if(senhas[f]===s){localStorage.setItem("usuarioAtual",f);location.reload()}else alert("Senha incorreta!")};
window.sair=()=>{localStorage.removeItem("usuarioAtual");location.reload()};
const usuarioLogado=localStorage.getItem("usuarioAtual");
if(usuarioLogado){document.getElementById("login-section").classList.add("hidden");document.getElementById("logado-msg").classList.remove("hidden");document.getElementById("logado-msg").style.display="flex";document.getElementById("area-restrita").classList.remove("hidden");document.getElementById("quem").innerText=usuarioLogado;if(usuarioLogado==="Vagner"){document.getElementById("btnConfigAdm").style.display="block";document.getElementById("btnLixeira").classList.remove("hidden");document.getElementById("filtroAdm").classList.remove("hidden")}
onSnapshot(query(collection(db,"dividas"),orderBy("dataDevendo","desc")),snap=>{devedores=snap.docs.map(x=>({id:x.id,...x.data()}));atualizarLista();const hoje=new Date(),chave=`rel_ontem_enviado_${usuarioLogado}_${hoje.toISOString().split("T")[0]}`;if(!localStorage.getItem(chave)){const ontem=new Date();ontem.setDate(hoje.getDate()-1);const o=ontem.toISOString().split("T")[0];document.getElementById("dataInicio").value=o;document.getElementById("dataFim").value=o;setTimeout(()=>{calcularDesempenho();enviarWhatsApp();localStorage.setItem(chave,"true")},1500)}})}
window.setFiltro=(f,el)=>{filtroAtual=f;document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));el.classList.add("active");document.getElementById("btnSomar").style.display=f==="pago"?"none":"block";fecharFoco()};
window.fecharFoco=()=>{clienteEmFoco=null;modoSoma=false;selecionados.clear();totalSoma=0;document.getElementById("somaBar").style.display="none";document.getElementById("btnVoltar").style.display="none";document.getElementById("form-rapido").classList.add("hidden");document.getElementById("form-anotar").classList.remove("hidden");document.getElementById("abas-filtro").classList.remove("hidden");atualizarLista()};
window.focarCliente=nome=>{clienteEmFoco=nome;document.getElementById("nomeFocado").innerText=nome;document.getElementById("btnVoltar").style.display="block";document.getElementById("form-anotar").classList.add("hidden");document.getElementById("form-rapido").classList.remove("hidden");document.getElementById("abas-filtro").classList.add("hidden");atualizarLista()};
window.ativarSoma=()=>{if(!clienteEmFoco)return alert("Selecione um cliente.");modoSoma=true;document.getElementById("somaBar").style.display="block";atualizarLista()};
window.atualizarLista=()=>{const lista=document.getElementById("lista");if(!lista)return;lista.innerHTML="";const agora=new Date(),limite=15*86400000;const ativos=devedores.filter(d=>{if(d.removida)return false;if(d.pago&&agora-new Date(d.dataPago)>limite)return false;return filtroAtual==="pago"?d.pago===true:d.pago!==true});if(!clienteEmFoco){const grupos=new Map();ativos.forEach(d=>{if(!grupos.has(d.nome))grupos.set(d.nome,{total:0,qtd:0});const g=grupos.get(d.nome);g.total+=Number(d.valor)||0;g.qtd++});grupos.forEach((g,n)=>{const c=document.createElement("div");c.className="cliente-group";const h=document.createElement("div");h.className="cliente-header";h.innerHTML=`<div><strong style="font-size:16px"></strong><br><small>${g.qtd} item(ns)</small></div><span style="font-weight:800;font-size:18px;color:${filtroAtual==="pago"?"var(--success)":"var(--danger)"}">R$ ${g.total.toFixed(2).replace(".",",")}</span>`;h.querySelector("strong").textContent=n;h.onclick=()=>focarCliente(n);c.appendChild(h);lista.appendChild(c)})}else{ativos.filter(d=>d.nome===clienteEmFoco).forEach(d=>{const c=document.createElement("div"),proc=processandoIds.has(d.id),sel=selecionados.has(d.id);c.className=`devedor ${d.pago?"status-pago":""} ${proc?"status-processando":""} ${sel?"selecionado-soma":""}`;let det=`<div class="info"><i class="fa-solid fa-pen"></i> ${d.funcionario||""} - ${new Date(d.dataDevendo).toLocaleString("pt-BR")}</div>`;if(d.pago)det+=`<div class="info" style="color:var(--success)"><i class="fa-solid fa-check"></i> ${d.quemPagou||""} - ${d.dataPago?new Date(d.dataPago).toLocaleString("pt-BR"):""}</div>`;const pode=usuarioLogado==="Vagner"||d.funcionario===usuarioLogado;c.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><strong style="font-size:14px"></strong><span style="font-weight:800;font-size:16px">R$ ${Number(d.valor).toFixed(2).replace(".",",")}</span></div>${d.observacao?`<span class="obs-text">${d.observacao}</span>`:""}${det}${d.pago&&d.pix?`<div class="actions"><button class="btn-action btn-pagar-card" data-pix="${d.id}">🖨️ SEGUNDA VIA PIX</button></div>`:""}${!d.pago&&!modoSoma?`<div class="actions"><button class="btn-action btn-pagar-card" data-pagar="${d.id}">${proc?'<span class="spinner"></span>':"PAGAR"}</button>${pode?`<button class="btn-action btn-excluir-ui" data-excluir="${d.id}"><i class="fa-solid fa-trash"></i></button>`:""}</div>`:""}`;c.querySelector("strong").textContent=clienteEmFoco;c.querySelector("[data-pix]")?.addEventListener("click",()=>segundaViaPix(d.id));c.querySelector("[data-pagar]")?.addEventListener("click",()=>acaoPagar(d.id));c.querySelector("[data-excluir]")?.addEventListener("click",()=>acaoExcluir(d.id));if(modoSoma)c.onclick=()=>{if(selecionados.has(d.id)){selecionados.delete(d.id);totalSoma-=Number(d.valor)}else{selecionados.add(d.id);totalSoma+=Number(d.valor)}document.getElementById("totalSoma").innerText="R$ "+totalSoma.toFixed(2).replace(".",",");atualizarLista()};lista.appendChild(c)})}};
window.segundaViaPix=id=>{const p=devedores.find(x=>x.id===id);if(!p||!p.pix)return alert("Segunda via disponível apenas para PIX.");imprimirRecibo(Number(p.valor).toFixed(2).replace(".",","),p.nome.replace("PIX - ",""))};
window.acaoPagar=async id=>{processandoIds.add(id);atualizarLista();setTimeout(async()=>{try{await updateDoc(doc(db,"dividas",id),{pago:true,quemPagou:usuarioLogado,dataPago:new Date().toISOString()})}finally{processandoIds.delete(id);atualizarLista()}},3000)};
window.acaoExcluir=async id=>{const motivo=usuarioLogado==="Vagner"?"Admin":prompt("MOTIVO:");if(!motivo)return;await updateDoc(doc(db,"dividas",id),{removida:true,motivoExclusao:motivo,quemExcluiu:usuarioLogado,dataApagada:new Date().toISOString()})};
window.adicionarDivida=async(idNome,idValor,idObs)=>{const n=idNome?document.getElementById(idNome).value.trim():clienteEmFoco,obs=document.getElementById(idObs).value.trim(),raw=document.getElementById(idValor).value.replace("R$ ","").replace(",", "."),v=parseFloat(raw);if(n&&!isNaN(v)&&v>=0){await addDoc(collection(db,"dividas"),{nome:n,observacao:obs,valor:v,funcionario:usuarioLogado,dataDevendo:new Date().toISOString(),pago:false,removida:false});if(idNome)document.getElementById(idNome).value="";document.getElementById(idObs).value="";document.getElementById(idValor).value=""}};
window.adicionarDividaRapida=()=>adicionarDivida(null,"valorRapido","obsRapida");
window.abrirRelatorio=()=>{const hoje=new Date().toISOString().split("T")[0];document.getElementById("dataInicio").value=hoje;document.getElementById("dataFim").value=hoje;document.getElementById("modalDesempenho").style.display="block";calcularDesempenho()};
window.definirHoje=()=>{const hoje=new Date().toISOString().split("T")[0];document.getElementById("dataInicio").value=hoje;document.getElementById("dataFim").value=hoje;calcularDesempenho()};
window.calcularDesempenho=()=>{const ini=new Date(document.getElementById("dataInicio").value+"T00:00:00"),fim=new Date(document.getElementById("dataFim").value+"T23:59:59"),ext=document.getElementById("extratoRecebidos");ext.innerHTML="";valAnotado=valProprio=valOutros=valPix=0;const alvo=usuarioLogado==="Vagner"?document.getElementById("filtroFuncionarioAdm").value:usuarioLogado;devedores.forEach(d=>{if(d.removida)return;const cri=new Date(d.dataDevendo);if((alvo==="TODOS"||d.funcionario===alvo)&&cri>=ini&&cri<=fim)valAnotado+=Number(d.valor)||0;if(d.pago){const pg=new Date(d.dataPago);if((alvo==="TODOS"||d.quemPagou===alvo)&&pg>=ini&&pg<=fim){if(d.funcionario===d.quemPagou)valProprio+=Number(d.valor)||0;else valOutros+=Number(d.valor)||0;if(d.pix===true)valPix+=Number(d.valor)||0;const linha=document.createElement("div");linha.style.cssText="padding:8px;border-bottom:1px solid #eee;font-size:11px";const b=document.createElement("b");b.textContent=d.nome;linha.append(b,document.createTextNode(" - R$ "+Number(d.valor).toFixed(2)));ext.appendChild(linha)}}});valRepasse=valProprio+valOutros;const fmt=n=>"R$ "+n.toFixed(2).replace(".",",");document.getElementById("resAnotado").innerText=fmt(valAnotado);document.getElementById("resRecebidoProprio").innerText=fmt(valProprio);document.getElementById("resRecebidoOutros").innerText=fmt(valOutros);document.getElementById("resRepasse").innerText=fmt(valRepasse);document.getElementById("resPix").innerText=fmt(valPix)};
window.imprimirRelatorio=()=>{const operador=localStorage.getItem("usuarioAtual")||"Operador",texto=`RELATORIO DE CAIXA\n\nVENDEDOR: ${operador}\nDATA: ${new Date().toLocaleString("pt-BR")}\n\nTOTAL A REPASSAR:\n${document.getElementById("resRepasse").innerText}\nTOTAL RECEBIDO VIA PIX:\n${document.getElementById("resPix").innerText}\n\nTOTAL ANOTADO:\n${document.getElementById("resAnotado").innerText}\n`,b64=btoa(unescape(encodeURIComponent(texto)));location.href=`rawbt:base64,${b64}`};
window.enviarWhatsApp=()=>{const ini=document.getElementById("dataInicio").value.split("-").reverse().join("/"),func=usuarioLogado==="Vagner"?document.getElementById("filtroFuncionarioAdm").value:usuarioLogado;const texto=`📌 *RELATÓRIO DE CAIXA* %0A👤 *${func}* %0A📅 ${ini} %0A%0A*TOTAL A REPASSAR:* %0A*R$ ${valRepasse.toFixed(2).replace(".",",")}* %0A*TOTAL RECEBIDO VIA PIX:* %0A*R$ ${valPix.toFixed(2).replace(".",",")}* %0A.................... %0A*Total Anotado no Fiado:* %0AR$ ${valAnotado.toFixed(2).replace(".",",")}`;window.open(`https://api.whatsapp.com/send?phone=5583996323995&text=${texto}`,"_blank")};
document.getElementById("dataInicio").onchange=calcularDesempenho;document.getElementById("dataFim").onchange=calcularDesempenho;
window.abrirLixeira=()=>{const l=document.getElementById("listaLixeira");l.innerHTML="";devedores.filter(d=>d.removida).forEach(d=>{const x=document.createElement("div");x.style.cssText="padding:10px;border-bottom:1px solid #eee";x.textContent=`${d.nome} - R$ ${d.valor}`;l.appendChild(x)});document.getElementById("modalLixeira").style.display="block"};
document.getElementById("confirmarSoma").onclick=async()=>{for(const id of [...selecionados])await updateDoc(doc(db,"dividas",id),{pago:true,quemPagou:usuarioLogado,dataPago:new Date().toISOString()});selecionados.clear();totalSoma=0;modoSoma=false;document.getElementById("somaBar").style.display="none";atualizarLista()};
document.getElementById("encerrarSoma").onclick=()=>{modoSoma=false;document.getElementById("somaBar").style.display="none";atualizarLista()};
window.abrirMenuUsuarios=()=>{const m=document.getElementById("menuUsuariosAdm");m.style.display=m.style.display==="block"?"none":"block";atualizarUsuariosAdm()};
window.salvarUsuarioAdm=()=>{if(usuarioLogado!=="Vagner")return;const u=document.getElementById("novoUser").value.trim(),s=document.getElementById("novaSenha").value.trim();if(!u||!s)return;senhas[u]=s;localStorage.setItem("usuariosSistema",JSON.stringify(senhas));atualizarUsuariosAdm()};
window.removerUsuarioAdm=u=>{if(usuarioLogado!=="Vagner"||u==="Vagner")return;delete senhas[u];localStorage.setItem("usuariosSistema",JSON.stringify(senhas));atualizarUsuariosAdm()};
window.editarUsuarioAdm=u=>{document.getElementById("novoUser").value=u;document.getElementById("novaSenha").value=senhas[u]};
window.atualizarUsuariosAdm=()=>{const l=document.getElementById("listaUsuariosAdm");if(!l)return;l.innerHTML="";Object.keys(senhas).forEach(u=>{const p=document.createElement("p"),b=document.createElement("b");b.textContent=u;p.append(b,document.createTextNode(" "));const e=document.createElement("button");e.textContent="✏️";e.onclick=()=>editarUsuarioAdm(u);const r=document.createElement("button");r.textContent="🗑️";r.onclick=()=>removerUsuarioAdm(u);p.append(e,r);l.appendChild(p)})};
</script>
</body>
</html>
